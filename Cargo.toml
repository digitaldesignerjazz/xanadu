[package]
name = "xanadu"
version = "0.2.0"
edition = "2021"
description = "Xanadu mesh core: gossip broadcast + Raft consensus"
license = "MIT"
authors = ["Esslinger & Co."]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
